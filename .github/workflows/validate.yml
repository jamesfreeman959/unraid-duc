name: Validate

# Checks the Community Applications files stay valid and in sync with the plugin manifest.

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Well-formed XML
        run: |
          xmllint --noout ca_profile.xml plugins/*.xml
          [[ ! -f plugin/duc.plg ]] || xmllint --noout --noent plugin/duc.plg

      - name: ca_profile.xml has a Profile
        run: |
          profile=$(xmllint --xpath 'normalize-space(/CommunityApplications/Profile)' ca_profile.xml)
          [[ -n "$profile" ]] || { echo "::error file=ca_profile.xml::<Profile> must not be empty"; exit 1; }

      - name: Wrapper fields and PluginURL match
        run: |
          for f in plugins/*.xml; do
            for tag in Name PluginURL Overview Support Project Category; do
              v=$(xmllint --xpath "normalize-space(/Plugin/$tag)" "$f")
              [[ -n "$v" ]] || { echo "::error file=$f::missing <$tag>"; exit 1; }
            done
          done
          if [[ -f plugin/duc.plg ]]; then
            plg=$(xmllint --noent --xpath 'string(/PLUGIN/@pluginURL)' plugin/duc.plg)
            wrap=$(xmllint --xpath 'normalize-space(/Plugin/PluginURL)' plugins/duc.xml)
            [[ "$plg" == "$wrap" ]] || { echo "::error::PluginURL mismatch: plg=$plg wrapper=$wrap"; exit 1; }
          fi
