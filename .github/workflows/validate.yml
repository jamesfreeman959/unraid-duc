name: Validate

# Checks the plugin manifest is well-formed. The Community Applications listing lives in
# jamesfreeman959/unraid-plugins, which checks its PluginURL against this repo's .plg.

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install xmllint
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libxml2-utils

      - name: Plugin manifest
        run: |
          xmllint --noout --noent plugin/duc.plg
          url=$(xmllint --noent --xpath 'string(/PLUGIN/@pluginURL)' plugin/duc.plg)
          expected="https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/main/plugin/duc.plg"
          [[ "$url" == "$expected" ]] || { echo "::error file=plugin/duc.plg::pluginURL is $url, expected $expected"; exit 1; }
